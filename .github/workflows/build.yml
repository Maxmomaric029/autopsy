name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup DirectX SDK
        shell: powershell
        run: |
          $url = "https://download.microsoft.com/download/A/E/7/AE743F1F-632B-4809-87A9-AA1BB3458E31/DXSDK_Jun10.exe"
          $out = "$env:TEMP\DXSDK_Jun10.exe"
          Invoke-WebRequest $url -OutFile $out
          Start-Process $out -ArgumentList "/U" -Wait
          echo "DXSDK_DIR=C:\Program Files (x86)\Microsoft DirectX SDK (June 2010)\" >> $env:GITHUB_ENV

      - name: Build Release x64
        shell: cmd
        run: |
          msbuild autopsy.vcxproj ^
            /p:Configuration=Release ^
            /p:Platform=x64 ^
            /p:PlatformToolset=v143 ^
            /m ^
            /nologo

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: miserable-${{ github.sha }}
          path: Build/miserable.exe
          if-no-files-found: error
